entity.ai_prompt_content_type.collection:
  path: '/admin/structure/ai-prompt-content-type'
  defaults:
    _entity_list: 'ai_prompt_content_type'
    _title: 'AI Prompt Type configuration'
  requirements:
    _permission: 'administer ai_prompt_content_type'

entity.ai_prompt_content_type.add_form:
  path: '/admin/structure/ai_prompt_content_type/add'
  defaults:
    _entity_form: 'ai_prompt_content_type.add'
    _title: 'Add an ai prompt type'
  requirements:
    _permission: 'administer ai_prompt_content_type'

entity.ai_prompt_content_type.edit_form:
  path: '/admin/structure/ai-prompt-content-type/{ai_prompt_content_type}'
  defaults:
    _entity_form: 'ai_prompt_content_type.edit'
    _title: 'Edit an ai prompt type'
  requirements:
    _permission: 'administer ai_prompt_content_type'

entity.ai_prompt_content_type.delete_form:
  path: '/admin/structure/ai-prompt-content-type/{ai_prompt_content_type}/delete'
  defaults:
    _entity_form: 'ai_prompt_content_type.delete'
    _title: 'Delete an ai prompt type'
  requirements:
    _permission: 'administer ai_prompt_content_type'
