entity.ai_prompt_content.test_form:
  path: '/admin/content/prompts/{ai_prompt_content}/test'
  defaults:
    _form: '\Drupal\thunder_ai_prompt_management\Form\AIPromptTestForm'
    _title_callback: '\Drupal\thunder_ai_prompt_management\Form\AIPromptTestForm::title'
  requirements:
    _entity_access: 'ai_prompt_content.update'
  options:
    parameters:
      ai_prompt_content:
        type: entity:ai_prompt_content

entity.ai_task.collection:
  path: '/admin/structure/ai-task'
  defaults:
    _entity_list: 'ai_task'
    _title: 'AI Task configuration'
  requirements:
    _permission: 'administer ai_task'

entity.ai_task.add_form:
  path: '/admin/structure/ai_task/add'
  defaults:
    _entity_form: 'ai_task.add'
    _title: 'Add an AI task'
  requirements:
    _permission: 'administer ai_task'

entity.ai_task.edit_form:
  path: '/admin/structure/ai-task/{ai_task}'
  defaults:
    _entity_form: 'ai_task.edit'
    _title: 'Edit an AI task'
  requirements:
    _permission: 'administer ai_task'

entity.ai_task.delete_form:
  path: '/admin/structure/ai-task/{ai_task}/delete'
  defaults:
    _entity_form: 'ai_task.delete'
    _title: 'Delete an AI task'
  requirements:
    _permission: 'administer ai_task'
